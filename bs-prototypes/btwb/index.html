<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>This page has moved</title>
    <!-- Beanstack's typeface, from the same Adobe Fonts kit as the prototypes -->
    <link rel="stylesheet" href="https://use.typekit.net/kus1pku.css" />
    <style>
      /* The bs-patterns design system's own values (components/ui/tokens.css, Button.css, the Banner's warning level) */
      :root {
        --c-bg: #f8f8f8;
        --c-surface: #fff;
        --c-border: #eaeaea;
        --c-gray-300: #dedede;
        --c-text: #424242;
        --c-text-light: #656565;
        --c-accent: #326ece;
        --c-accent-active: #2858a5;
        --warning-bg: #ffe091;
        --warning-ink: #895a04;
        --font-sans: 'museo-sans-rounded', 'Nunito', 'Trebuchet MS', sans-serif;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--c-bg);
        color: var(--c-text);
        font: 500 16px/1.5 var(--font-sans);
      }
      main {
        width: 100%;
        max-width: 32rem;
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        border-radius: 12px;
        padding: 32px 28px;
        display: grid;
        gap: 20px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.25;
      }
      .link {
        color: var(--c-accent);
        font-size: 15px;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      /* .btn .btn--md */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        padding: 0 20px;
        border: 2px solid transparent;
        border-radius: 10px;
        font: 700 15px var(--font-sans);
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.13s ease;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px #5599e1;
      }
      .btn--primary {
        background: var(--c-accent);
        border-color: var(--c-accent);
        color: #fff;
      }
      .btn--primary:hover {
        background: var(--c-accent-active);
        border-color: var(--c-accent-active);
      }
      .btn--secondary {
        background: transparent;
        border-color: var(--c-gray-300);
        color: var(--c-text);
      }
      /* .bnr .bnr--warning */
      .bnr {
        margin: 0;
        padding: 12px 20px;
        border-radius: 10px;
        background: var(--warning-bg);
        color: var(--warning-ink);
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This page has moved</h1>
      <a class="link" id="new-url" href="https://zoobean.github.io/bs-prototypes/"
        >https://zoobean.github.io/bs-prototypes/</a
      >
      <div class="actions">
        <a class="btn btn--primary" id="open" href="https://zoobean.github.io/bs-prototypes/">Open the new page</a>
        <button type="button" class="btn btn--secondary" id="copy">Copy link</button>
      </div>
      <p class="bnr">This old link stops working on <span id="date">October 31, 2026</span>.</p>
    </main>
    <script>
      // The day the old addresses stop working: set by tools/build.mjs --shuts-down (the move date + 30 days)
      var SHUTS_DOWN_ON = '2026-10-31'
      var NEW_ORIGIN = 'https://zoobean.github.io'

      // Same path, query and #section on the new site; anything outside bs-prototypes goes to its home page
      var path = location.pathname.indexOf('/bs-prototypes') === 0 ? location.pathname : '/bs-prototypes/'
      // (the Asset Generator moved to its own repo, zoobean/bs-assets: its old page plays its demo video instead)
      if (path.indexOf('/bs-prototypes/challenge-asset-studio') === 0) path = '/bs-prototypes/watch/asset-generator-demo/'
      var target = NEW_ORIGIN + path + location.search + location.hash
      var link = document.getElementById('new-url')
      link.textContent = target
      link.href = target
      document.getElementById('open').href = target
      document.getElementById('date').textContent = new Date(SHUTS_DOWN_ON + 'T12:00:00').toLocaleDateString(
        'en-US',
        { month: 'long', day: 'numeric', year: 'numeric' },
      )

      var copy = document.getElementById('copy')
      copy.addEventListener('click', function () {
        var copied = function () {
          copy.textContent = 'Copied'
          setTimeout(function () {
            copy.textContent = 'Copy link'
          }, 2000)
        }
        var selectIt = function () {
          var range = document.createRange()
          range.selectNodeContents(link)
          var selection = window.getSelection()
          selection.removeAllRanges()
          selection.addRange(range)
        }
        if (navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(target).then(copied, selectIt)
        else selectIt()
      })
    </script>
  </body>
</html>
